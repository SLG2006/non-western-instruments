name: gates
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: pytest -q
      # Audio is not in git, so the clips stage (file hashes) is checked locally, not here.
      - run: python scripts/validate.py --stage candidates --stage approved --stage queue --stage labels --stage splits --stage results
